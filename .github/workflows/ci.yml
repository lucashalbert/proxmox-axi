name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Lockfile is generated by npm 11; older npm can fail `npm ci`.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run build:skill -- --check

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@^11.5.1
      # PR title is checked too: squash-merge uses it as the commit message.
      - name: Lint PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx -y -p @commitlint/cli@21 -p @commitlint/config-conventional@21 commitlint --config commitlint.config.js
      - name: Lint PR commits
        run: npx -y -p @commitlint/cli@21 -p @commitlint/config-conventional@21 commitlint --config commitlint.config.js --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
